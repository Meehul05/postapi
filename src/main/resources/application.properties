spring.application.name=postapi
spring.datasource.url=jdbc:mysql://localhost:3306/postapi
spring.datasource.username=root
spring.datasource.password=asdf@$$#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=postapi-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.postapi
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.postapi.EventMessage